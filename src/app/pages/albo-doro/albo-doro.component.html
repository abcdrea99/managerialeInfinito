<section class="page-hero">
    <span>Storia del torneo</span>
    <h1>Albo d’oro</h1>
    <p>Campionati, coppe, supercoppe e riconoscimenti del Manageriale Infinito.</p>
</section>

<div *ngIf="loading" class="message">Caricamento albo d’oro...</div>

<div *ngIf="errorMessage" class="message error">
    {{ errorMessage }}
</div>

<section *ngIf="!loading && !errorMessage" class="hall-wrapper">
    <article *ngFor="let item of items" class="hall-card">
        <div class="hall-card-header">
            <div>
                <span>{{ item.season }}</span>
                <h2>{{ item.title }}</h2>
            </div>

            <div class="trophy">🏆</div>
        </div>

        <div class="hall-columns">
            <div class="hall-column primary" [innerHTML]="formatText(item.left_content)"></div>

            <div class="hall-column secondary" [innerHTML]="formatText(item.right_content)"></div>
        </div>
    </article>

    <div *ngIf="items.length === 0" class="message">
        Nessun elemento presente nell’albo d’oro.
    </div>
</section>
