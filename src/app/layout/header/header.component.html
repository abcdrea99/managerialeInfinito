<header class="app-header">
    <a class="brand" routerLink="/dashboard" (click)="closeMobileMenu()">
        Manageriale Infinito
    </a>

    <button type="button" class="mobile-menu-button" (click)="toggleMobileMenu()" aria-label="Apri menu">
        ☰
    </button>

    <nav class="main-nav" [class.open]="isMobileMenuOpen">
        <a routerLink="/dashboard" routerLinkActive="active" (click)="closeMobileMenu()">Home</a>
        <a routerLink="/regolamento" routerLinkActive="active" (click)="closeMobileMenu()">Regolamento</a>
        <a routerLink="/classifica" routerLinkActive="active" (click)="closeMobileMenu()">Classifica</a>
        <a routerLink="/rose" routerLinkActive="active" (click)="closeMobileMenu()">Rose</a>
        <a routerLink="/stadio" routerLinkActive="active" (click)="closeMobileMenu()">Stadio</a>
        <a routerLink="/albo-doro" routerLinkActive="active" (click)="closeMobileMenu()">Albo d’oro</a>

        <a *ngIf="isSuperadmin" routerLink="/admin" routerLinkActive="active" (click)="closeMobileMenu()">
            Admin
        </a>

        <a *ngIf="!isLoggedIn" routerLink="/login" routerLinkActive="active" (click)="closeMobileMenu()">
            Login
        </a>

        <button *ngIf="isLoggedIn" type="button" class="logout-button" (click)="logout(); closeMobileMenu()">
            Logout
        </button>
    </nav>
</header>
